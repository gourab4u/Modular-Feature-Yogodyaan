<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>We've Moved - Yogodyaan</title>
    <style>
        /* Ensure no scrolling and full-height baseline */
        html {
            height: 100%;
            overflow: hidden;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            /* Yogique brand palette sampled from Brand.png */
            --bg-start: #F6FBFC;
            --bg-end: #EEF6F9;
            --accent-start: #e6ac19; /* primary gold */
            --accent-end: #e3a917;   /* secondary gold */
            --accent-dark: #c17a0b;  /* darker gold/brown for headings/text */
            --accent-shadow: 230,172,25; /* rgb(230,172,25) */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top,20px) env(safe-area-inset-right,20px) env(safe-area-inset-bottom,20px) env(safe-area-inset-left,20px);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 6s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 50px;
            max-width: 900px;
            width: 100%;
            /* allow JS scaling to fit any viewport without scrolling */
            transform-origin: center top;
            transition: transform 150ms ease-out;
            will-change: transform;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
        }

        h1 {
            color: var(--accent-dark);
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--accent-dark);
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .new-domain {
            background: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: 600;
            margin: 30px 0;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(var(--accent-shadow), 0.18);
            transition: transform 0.3s ease;
        }

        .new-domain:hover {
            transform: translateY(-5px);
        }

        .breathing-section {
            margin: 40px 0;
            padding: 40px;
            background: linear-gradient(135deg, rgba(var(--accent-shadow), 0.05) 0%, rgba(var(--accent-shadow), 0.02) 100%);
            border-radius: 20px;
            border: 2px solid rgba(var(--accent-shadow), 0.06);
        }

        .breathing-title {
            color: var(--accent-dark);
            font-size: 1.5em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .breathing-circle {
            width: 250px;
            height: 250px;
            margin: 30px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(var(--accent-shadow), 0.18);
            transition: all 4s ease-in-out;
        }

        .breathing-circle.inhale {
            transform: scale(1.5);
            box-shadow: 0 15px 60px rgba(var(--accent-shadow), 0.28);
        }

        .breathing-circle.exhale {
            transform: scale(1);
            box-shadow: 0 10px 40px rgba(var(--accent-shadow), 0.18);
        }

        .breathing-text {
            color: white;
            font-size: 2.2em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .timer-display {
            font-size: 2.5em;
            color: var(--accent-dark);
            font-weight: 700;
            margin: 20px 0;
        }

        .breathing-instruction {
            color: var(--accent-dark);
            font-size: 1.1em;
            margin-top: 15px;
            min-height: 30px;
        }

        .redirect-btn {
            background: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(var(--accent-shadow), 0.18);
            transition: all 0.3s ease;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .redirect-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(var(--accent-shadow), 0.45);
        }

        .redirect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .skip-btn {
            background: transparent;
            color: var(--accent-dark);
            border: 2px solid var(--accent-dark);
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .skip-btn:hover {
            background: var(--accent-dark);
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
            }

            h1 {
                font-size: 2em;
            }

            .new-domain {
                font-size: 1.2em;
                padding: 15px 20px;
            }

            .breathing-circle {
                width: 150px;
                height: 150px;
            }

            .breathing-text {
                font-size: 1.4em;
            }

            .redirect-btn {
                padding: 15px 40px;
                font-size: 1.1em;
            }
            /* Make the card feel like a PWA full-width sheet on mobile */
            .container {
                max-width: none;
                width: calc(100% - 32px);
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.18);
                transform: none !important; /* prevent JS scale override on mobile */
            }
            body {
                padding: env(safe-area-inset-top,12px) env(safe-area-inset-right,12px) env(safe-area-inset-bottom,12px) env(safe-area-inset-left,12px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://yogique.life/images/Brand.png" alt="Yogodyaan Logo" style="width: 120px; height: 120px; margin: 0 auto 30px; display: block; object-fit: contain;">

        <h1>Namaste 🙏</h1>
        
        <p class="subtitle">
            We've embarked on a new journey! Our yoga community has found a new home.
        </p>

        <div class="new-domain">
            yogique.life
        </div>

        <div class="breathing-section">
            <div class="breathing-title">Take a Mindful Breath Before You Continue</div>
            <p style="color: rgba(var(--accent-shadow),0.9); font-size: 0.95em; margin-bottom: 10px;">
                Join us for a 1-minute breathing exercise
            </p>

            <div class="breathing-circle" id="breathingCircle">
                <div class="breathing-text" id="breathingText">Ready</div>
            </div>

            <div class="timer-display" id="timerDisplay">1:00</div>
            <div class="breathing-instruction" id="instruction">Click "Start" to begin</div>

            <button class="redirect-btn" id="startBtn" onclick="startBreathing()">
                Start Breathing Exercise
            </button>
            <br>
            <button class="skip-btn" onclick="skipToSite()">
                Skip & Continue →
            </button>
        </div>
    </div>

    <script>
        let totalTime = 60;
        let currentTime = 60;
        let breathingInterval;
        let timerInterval;
        let breathingPhase = 'ready';
        let cycleCount = 0;

        function startBreathing() {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').style.display = 'none';
            breathingPhase = 'inhale';
            cycleCount = 0;
            
            startBreathingCycle();
            
            timerInterval = setInterval(() => {
                currentTime--;
                const minutes = Math.floor(currentTime / 60);
                const seconds = currentTime % 60;
                document.getElementById('timerDisplay').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (currentTime <= 0) {
                    completeExercise();
                }
            }, 1000);
        }

        function startBreathingCycle() {
            breathingInterval = setInterval(() => {
                const circle = document.getElementById('breathingCircle');
                const text = document.getElementById('breathingText');
                const instruction = document.getElementById('instruction');
                
                if (breathingPhase === 'inhale') {
                    circle.classList.remove('exhale');
                    circle.classList.add('inhale');
                    text.textContent = 'Inhale';
                    instruction.textContent = 'Breathe in slowly through your nose...';
                    breathingPhase = 'hold1';
                    
                } else if (breathingPhase === 'hold1') {
                    text.textContent = 'Hold';
                    instruction.textContent = 'Hold your breath gently...';
                    breathingPhase = 'exhale';
                    
                } else if (breathingPhase === 'exhale') {
                    circle.classList.remove('inhale');
                    circle.classList.add('exhale');
                    text.textContent = 'Exhale';
                    instruction.textContent = 'Breathe out slowly through your mouth...';
                    breathingPhase = 'hold2';
                    
                } else if (breathingPhase === 'hold2') {
                    text.textContent = 'Hold';
                    instruction.textContent = 'Pause before the next breath...';
                    breathingPhase = 'inhale';
                    cycleCount++;
                }
            }, 4000);
        }

        function completeExercise() {
            clearInterval(breathingInterval);
            clearInterval(timerInterval);
            
            document.getElementById('breathingText').textContent = 'Complete!';
            document.getElementById('instruction').textContent = 'Redirecting you now...';
            
            setTimeout(() => {
                window.location.href = 'https://yogique.life/';
            }, 2000);
        }

        function skipToSite() {
            if (breathingInterval) clearInterval(breathingInterval);
            if (timerInterval) clearInterval(timerInterval);
            window.location.href = 'https://yogique.life/';
        }

        // Fit the main container to the viewport by scaling if needed
        function fitToViewport() {
            const container = document.querySelector('.container');
            if (!container) return;

            // reset any previous scale
            container.style.transform = 'scale(1)';

            // For small screens we want a full-width PWA-like card handled by CSS.
            if (window.innerWidth <= 600) {
                container.style.transform = 'none';
                container.style.margin = '0 auto';
                return;
            }

            const rect = container.getBoundingClientRect();
            const padding = 24; // keep some breathing room
            const availableWidth = window.innerWidth - padding * 2;
            const availableHeight = window.innerHeight - padding * 2;

            const scaleW = availableWidth / rect.width;
            const scaleH = availableHeight / rect.height;
            const scale = Math.min(scaleW, scaleH, 1);

            container.style.transform = `scale(${scale})`;
        }

        // Subtle mobile vibration on first user interaction
        function setupMobileVibration() {
            if (!('vibrate' in navigator)) return;

            const doVibrate = () => {
                try { navigator.vibrate(15); } catch (e) {}
                window.removeEventListener('touchstart', doVibrate, {passive: true});
                window.removeEventListener('click', doVibrate, {passive: true});
            };

            // Prefer touchstart for mobile, but also listen for click as fallback
            window.addEventListener('touchstart', doVibrate, {passive: true, once: true});
            window.addEventListener('click', doVibrate, {passive: true, once: true});
        }

        // Run fit on load and on resize/orientation change
        window.addEventListener('load', () => {
            fitToViewport();
            setupMobileVibration();
        });
        window.addEventListener('resize', () => requestAnimationFrame(fitToViewport));
        window.addEventListener('orientationchange', () => setTimeout(fitToViewport, 200));
    </script>
</body>
</html>
